{% include header.html %}

<section class="conference-hero bg-body-tertiary rounded p-4 p-md-5 mb-5" aria-labelledby="conference-title">
  <div class="row align-items-center g-4">
    <div class="col-lg-8">
      <p class="conference-eyebrow text-primary fw-semibold mb-3">Biology · Computation · Intelligence</p>
      <h1 id="conference-title" class="display-3 text-break mb-4">{{ site.title | escape }}</h1>
      <p class="lead mb-4">{{ site.description }}</p>
      <p class="conference-date fs-4 fw-semibold mb-1">
        <time datetime="{{ site.event.start_date }}">{{ site.event.date_label }}</time>
      </p>
      <p class="text-body-secondary mb-4">Venue to be announced</p>
      <div class="d-flex flex-wrap gap-2">
        <a class="btn btn-primary btn-lg" href="{{ site.event.calendar | relative_url }}" download>Save the dates</a>
        <a class="btn btn-outline-primary btn-lg" href="{{ '/participation/' | relative_url }}">Participation details</a>
      </div>
    </div>
    <div class="col-lg-4 text-center">
      <img class="conference-illustration" src="{{ '/assets/images/neural-network.svg' | relative_url }}" alt="" width="360" height="360">
    </div>
  </div>
</section>

{{ content }}

{% include site-footer.html %}
{% include footer.html %}
